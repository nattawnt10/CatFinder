<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบแจ้งแมวหาย-แมวหลง (Fixed Version)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        :root { --primary-color: #2c3e50; --secondary-color: #4ca1af; --success-green: #28a745; --fb-blue: #1877F2; }
        body { background-color: #f0f2f5; font-family: 'Sarabun', sans-serif; }
        
        /* Header & Search */
        header { background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); border-radius: 0 0 40px 40px; padding: 50px 0 70px; color: white; text-align: center; }
        .search-wrapper { max-width: 800px; margin: -40px auto 30px; padding: 0 20px; }
        .search-box { background: white; border-radius: 50px; padding: 5px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; }
        .search-input { border: none; padding: 12px 25px; width: 100%; border-radius: 50px; outline: none; }
        
        /* Filter Buttons */
        .btn-filter { border-radius: 50px; padding: 8px 25px; background: white; border: 1px solid #ddd; transition: 0.3s; font-weight: 600; }
        .btn-filter.active { background: var(--primary-color); color: white; }
        
        /* Cat Card */
        .cat-card { border: none; border-radius: 25px; overflow: hidden; background: white; position: relative; transition: 0.3s; height: 100%; box-shadow: 0 6px 18px rgba(0,0,0,0.06); cursor: pointer; }
        .card-img-container { height: 180px; overflow: hidden; }
        .card-img-top { width: 100%; height: 100%; object-fit: cover; }
        .status-badge { position: absolute; top: 12px; right: 12px; padding: 5px 12px; border-radius: 50px; color: white; font-size: 0.75rem; font-weight: bold; z-index: 5; }
        .reward-tag { position: absolute; top: 10px; left: -30px; background: #f1c40f; color: #000; padding: 4px 35px; transform: rotate(-45deg); font-weight: 800; font-size: 0.7rem; z-index: 5; }

        /* Modal เลื่อนได้ พื้นหลังไม่หาย */
        .modal-content { border: none; border-radius: 25px; background-color: #fff !important; }
        .modal-body { padding: 0; background-color: #fff; }
        .carousel-item img { height: 400px; object-fit: cover; width: 100%; }
        .detail-body { padding: 25px; background: white; }
        .btn-call { background: var(--success-green); color: white !important; border-radius: 50px; padding: 12px; text-align: center; text-decoration: none; display: block; margin-bottom: 10px; }
        .btn-fb { background: var(--fb-blue); color: white !important; border-radius: 50px; padding: 12px; text-align: center; text-decoration: none; display: block; }
        
        @media (max-width: 768px) {
            .carousel-item img { height: 280px; }
            .modal-dialog { margin: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1 class="fw-bold">🐾 ศูนย์แจ้งแมวหาย-แมวหลง</h1>
        <p>ช่วยพาน้องกลับบ้านด้วยปลายนิ้วคุณ</p>
    </div>
</header>

<div class="search-wrapper">
    <div class="search-box">
        <input type="text" id="cat-search" class="search-input" placeholder="ค้นหาชื่อ, พิกัด, สี..." onkeyup="combinedFilter()">
    </div>
</div>

<div class="container text-center mb-4">
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
        <button class="btn btn-filter active" onclick="filterType('ทั้งหมด', this)">ทั้งหมด</button>
        <button class="btn btn-filter" onclick="filterType('แมวหาย', this)">🚨 แมวหาย</button>
        <button class="btn btn-filter" onclick="filterType('แมวหลง', this)">🏠 แมวหลง</button>
    </div>
    <div class="row g-2 justify-content-center">
        <div class="col-6 col-md-auto">
            <select class="form-select rounded-pill border-0 shadow-sm" id="filter-gender" onchange="combinedFilter()">
                <option value="ทั้งหมด">เพศทั้งหมด</option>
                <option value="ผู้">เพศผู้</option>
                <option value="เมีย">เพศเมีย</option>
            </select>
        </div>
        <div class="col-6 col-md-auto">
            <select class="form-select rounded-pill border-0 shadow-sm" id="filter-color" onchange="combinedFilter()">
                <option value="ทั้งหมด">ทุกสี</option>
                <option value="ขาว">ขาว</option><option value="ดำ">ดำ</option><option value="ส้ม">ส้ม</option>
            </select>
        </div>
    </div>
</div>

<div class="container mb-5">
    <div id="display-area" class="row row-cols-2 row-cols-md-4 g-3"></div>
</div>

<div class="modal fade" id="catDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content shadow">
            <div class="modal-body" id="modal-content-area"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    let allCatData = [];
    let currentTypeFilter = 'ทั้งหมด';
    const csv_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQBat1WTJunSt9WRbR_w0q4uNMC_txGtfw6SRv2XlkdXtHxcNZafPzc9LNSN8Rn5xPXI717FFddww89/pub?gid=1934718548&single=true&output=csv';

    function init() {
        Papa.parse(csv_url, {
            download: true, header: true,
            complete: function(results) {
                allCatData = results.data.filter(row => getSafeValue(row, ['ชื่อแมว']) !== '');
                combinedFilter(); // เรียกครั้งแรกเพื่อให้แสดงผล
            }
        });
    }

    function getSafeValue(row, keys) {
        const foundKey = Object.keys(row).find(k => keys.some(key => k.trim().includes(key)));
        return foundKey ? row[foundKey].toString().trim() : '';
    }

    function fixImageUrl(url) {
        if (!url || url === "") return '';
        if (url.includes('drive.google.com')) {
            const id = url.split('id=')[1] || url.split('/d/')[1].split('/')[0];
            return `https://docs.google.com/uc?export=view&id=${id}`;
        }
        return url;
    }

    function filterType(type, btn) {
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTypeFilter = type;
        combinedFilter();
    }

    function combinedFilter() {
        const searchInput = document.getElementById('cat-search').value.toLowerCase();
        const genderVal = document.getElementById('filter-gender').value;
        const colorVal = document.getElementById('filter-color').value;

        const filtered = allCatData.filter(row => {
            const type = getSafeValue(row, ['ประเภท']);
            const gender = getSafeValue(row, ['เพศ']);
            const color = getSafeValue(row, ['สี']);
            const name = getSafeValue(row, ['ชื่อแมว']).toLowerCase();
            const loc = getSafeValue(row, ['สถานที่', 'พิกัด']).toLowerCase();

            const matchType = (currentTypeFilter === 'ทั้งหมด' || type === currentTypeFilter);
            const matchGender = (genderVal === 'ทั้งหมด' || gender === genderVal);
            const matchColor = (colorVal === 'ทั้งหมด' || color.includes(colorVal));
            const matchSearch = name.includes(searchInput) || loc.includes(searchInput);

            return matchType && matchGender && matchColor && matchSearch;
        });
        displayCats(filtered);
    }

    function displayCats(data) {
        const container = document.getElementById('display-area');
        container.innerHTML = '';
        data.forEach(row => {
            const idx = allCatData.indexOf(row);
            const type = getSafeValue(row, ['ประเภท']);
            const reward = getSafeValue(row, ['สินน้ำใจ']);
            container.innerHTML += `
                <div class="col">
                    <div class="cat-card" onclick="showDetail(${idx})">
                        ${reward && reward !== '0' ? `<div class="reward-tag">฿${reward}</div>` : ''}
                        <span class="status-badge ${type === 'แมวหาย' ? 'bg-danger' : 'bg-primary'}">${type}</span>
                        <div class="card-img-container"><img src="${fixImageUrl(getSafeValue(row, ['รูปภาพที่ 1']))}" class="card-img-top"></div>
                        <div class="p-3">
                            <h6 class="fw-bold mb-1 text-truncate">${getSafeValue(row, ['ชื่อแมว'])}</h6>
                            <p class="small text-muted mb-0">📍 ${getSafeValue(row, ['สถานที่'])}</p>
                        </div>
                    </div>
                </div>`;
        });
    }

    function showDetail(index) {
        const row = allCatData[index];
        const modalArea = document.getElementById('modal-content-area');
        const images = [getSafeValue(row, ['รูปภาพที่ 1']), getSafeValue(row, ['รูปภาพที่ 2']), getSafeValue(row, ['รูปภาพที่ 3'])].filter(i => i !== '').map(fixImageUrl);
        
        let carousel = images.map((img, i) => `<div class="carousel-item ${i===0?'active':''}"><img src="${img}"></div>`).join('');

        modalArea.innerHTML = `
            <div class="row g-0">
                <div class="col-lg-7 bg-dark"><div id="c" class="carousel slide" data-bs-ride="carousel"><div class="carousel-inner">${carousel}</div></div></div>
                <div class="col-lg-5 detail-body">
                    <div class="d-flex justify-content-between"><h3>${getSafeValue(row, ['ชื่อแมว'])}</h3><button class="btn-close" data-bs-dismiss="modal"></button></div>
                    <hr>
                    <p><b>เพศ:</b> ${getSafeValue(row, ['เพศ'])} | <b>สี:</b> ${getSafeValue(row, ['สี'])}</p>
                    <p><b>พิกัด:</b> ${getSafeValue(row, ['สถานที่'])}</p>
                    <div class="bg-light p-3 rounded mb-3" style="font-size:0.9rem;">${getSafeValue(row, ['รายละเอียด'])}</div>
                    <a href="tel:${getSafeValue(row, ['เบอร์ติดต่อ'])}" class="btn-call">📞 โทรหาเจ้าของ</a>
                    <a href="${getSafeValue(row, ['Facebook'])}" target="_blank" class="btn-fb">🔵 ดูโพสต์ Facebook</a>
                </div>
            </div>`;
        new bootstrap.Modal(document.getElementById('catDetailModal')).show();
    }

    window.onload = init;
</script>
</body>
</html>
