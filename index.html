<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบแจ้งแมวหาย-แมวหลง (Full Version)</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #4ca1af;
            --accent-gold: #ffd700;
            --danger-red: #e74c3c;
            --success-green: #28a745;
            --fb-blue: #1877F2;
        }

        body { 
            background-color: #f0f2f5; 
            font-family: 'Sarabun', sans-serif; 
            color: #333;
            /* ป้องกันอาการจอกระตุกเวลาเปิด Modal */
            padding-right: 0 !important; 
        }
        
        header { 
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); 
            border-radius: 0 0 40px 40px; 
            padding: 50px 0 70px; 
            color: white; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-wrapper { 
            max-width: 800px; 
            margin: -40px auto 30px; 
            padding: 0 20px;
        }
        .search-box { 
            background: white;
            border-radius: 50px;
            padding: 5px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
        }
        .search-input { 
            border: none;
            padding: 12px 25px;
            width: 100%;
            border-radius: 50px;
            outline: none;
            font-size: 1.1rem;
        }

        .filter-section {
            margin-bottom: 30px;
        }
        .btn-filter {
            border-radius: 50px;
            padding: 8px 25px;
            background: white;
            border: 1px solid #ddd;
            color: #555;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-filter.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-report {
            background-color: var(--success-green);
            color: white;
            border-radius: 50px;
            padding: 8px 25px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            border: none;
        }
        .btn-report:hover {
            background-color: #218838;
            color: white;
            transform: scale(1.05);
        }

        .cat-card { 
            border: none; 
            border-radius: 25px; 
            overflow: hidden; 
            background: white; 
            position: relative; 
            transition: all 0.3s ease;
            height: 100%;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            cursor: pointer;
        }
        .cat-card:hover { transform: translateY(-5px); }
        .card-img-container { height: 220px; overflow: hidden; background-color: #f8f9fa; }
        .card-img-top { width: 100%; height: 100%; object-fit: cover; }
        
        .reward-tag { 
            position: absolute; top: 10px; left: -30px; 
            background: linear-gradient(45deg, #f1c40f, #f39c12); 
            color: #000; font-weight: 800; padding: 4px 35px; 
            transform: rotate(-45deg); z-index: 20; font-size: 0.7rem; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .status-badge { 
            position: absolute; top: 12px; right: 12px; 
            padding: 6px 15px; border-radius: 50px; font-size: 0.75rem; 
            z-index: 10; color: white; font-weight: bold;
        }

        /* แก้ไข Modal ให้เลื่อนลงได้บนมือถือ */
        .modal {
            overflow-y: auto !important;
        }
        .modal-content {
            border: none;
            border-radius: 30px;
            overflow: hidden;
            height: auto;
        }
        .carousel-item img {
            height: 450px;
            object-fit: cover;
        }
        .detail-body {
            padding: 30px;
            background: white;
        }
        .reward-highlight {
            background: #fff9e6;
            border: 1px dashed #f39c12;
            padding: 12px;
            border-radius: 15px;
            color: #d35400;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-call { background-color: var(--success-green); color: white !important; border-radius: 50px; padding: 12px; font-weight: bold; }
        .btn-fb { background-color: var(--fb-blue); color: white !important; border-radius: 50px; padding: 12px; font-weight: bold; }

        @media (max-width: 768px) {
            .carousel-item img { height: 320px; }
            .card-img-container { height: 160px; }
            .detail-body { padding: 20px; }
            /* บังคับให้ Modal สกロールได้ในตัวเมื่อจอเล็ก */
            .modal-dialog {
                margin: 10px;
                display: flex;
                align-items: center;
                min-height: calc(100% - 20px);
            }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1 class="fw-bold mb-2">🐾 ศูนย์แจ้งแมวหาย-แมวหลง</h1>
        <p class="opacity-75">รวมเบาะแสเพื่อพาน้องกลับบ้าน</p>
    </div>
</header>

<div class="search-wrapper">
    <div class="search-box">
        <input type="text" id="cat-search" class="search-input" placeholder="ค้นหาชื่อ, พิกัด, สี หรือจังหวัด..." onkeyup="combinedFilter()">
    </div>
</div>

<div class="container text-center filter-section">
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
        <button class="btn btn-filter active" onclick="filterType('ทั้งหมด', this)">ทั้งหมด</button>
        <button class="btn btn-filter" onclick="filterType('แมวหาย', this)">🚨 แมวหาย</button>
        <button class="btn btn-filter" onclick="filterType('แมวหลง', this)">🏠 แมวหลง</button>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfFT6EzdOULOLvGR8VZh0Xm9P78Ys_bJi9_MN1lYfZGGPBlRA/viewform" class="btn btn-report">➕ แจ้งข้อมูล</a>
    </div>
    
    <div class="row g-2 justify-content-center">
        <div class="col-6 col-md-auto">
            <select class="form-select border-0 shadow-sm rounded-pill" id="filter-gender" onchange="combinedFilter()">
                <option value="ทั้งหมด">เพศทั้งหมด</option>
                <option value="ผู้">เพศผู้</option>
                <option value="เมีย">เพศเมีย</option>
            </select>
        </div>
        <div class="col-6 col-md-auto">
            <select class="form-select border-0 shadow-sm rounded-pill" id="filter-color" onchange="combinedFilter()">
                <option value="ทั้งหมด">สีทั้งหมด</option>
                <option value="ขาว">ขาว</option><option value="ดำ">ดำ</option><option value="ส้ม">ส้ม</option>
                <option value="เทา">เทา</option><option value="สามสี">สามสี</option><option value="ลายสลิด">ลายสลิด</option>
            </select>
        </div>
    </div>
</div>

<div class="container mb-5">
    <div id="display-area" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></div>
</div>

<!-- Modal - เพิ่ม class modal-dialog-scrollable เพื่อให้เลื่อนดูเนื้อหาได้ -->
<div class="modal fade" id="catDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content shadow-lg">
            <div id="modal-content-area"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    let allCatData = [];
    let currentTypeFilter = 'ทั้งหมด';

    const csv_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQBat1WTJunSt9WRbR_w0q4uNMC_txGtfw6SRv2XlkdXtHxcNZafPzc9LNSN8Rn5xPXI717FFddww89/pub?gid=1934718548&single=true&output=csv';

    function fixImageUrl(url) {
        if (!url || url.trim() === "") return '';
        if (url.includes('drive.google.com')) {
            const id = url.split('id=')[1] || url.split('/d/')[1].split('/')[0];
            return `https://docs.google.com/uc?export=view&id=${id}`;
        }
        return url;
    }

    function getSafeValue(row, keys) {
        const foundKey = Object.keys(row).find(k => keys.some(key => k.toLowerCase().includes(key.toLowerCase())));
        return foundKey ? row[foundKey].toString().trim() : '';
    }

    function init() {
        Papa.parse(csv_url, {
            download: true, header: true,
            complete: function(results) {
                allCatData = results.data.filter(row => getSafeValue(row, ['ชื่อแมว']) !== '');
                displayCats(allCatData);
            }
        });
    }

    function filterType(type, btn) {
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTypeFilter = type;
        combinedFilter();
    }

    function combinedFilter() {
        const searchInput = document.getElementById('cat-search').value.toLowerCase().trim();
        const genderVal = document.getElementById('filter-gender').value;
        const colorVal = document.getElementById('filter-color').value;

        const filtered = allCatData.filter(row => {
            const rowType = getSafeValue(row, ['ประเภท']);
            const rowGender = getSafeValue(row, ['เพศ']);
            const rowColor = getSafeValue(row, ['สี']);
            const rowName = getSafeValue(row, ['ชื่อแมว']).toLowerCase();
            const rowLoc = getSafeValue(row, ['สถานที่', 'พิกัด', 'จังหวัด']).toLowerCase();
            const rowDetail = getSafeValue(row, ['รายละเอียด']).toLowerCase();

            const matchType = (currentTypeFilter === 'ทั้งหมด' || rowType === currentTypeFilter);
            const matchGender = (genderVal === 'ทั้งหมด' || rowGender === genderVal);
            const matchColor = (colorVal === 'ทั้งหมด' || rowColor.includes(colorVal));
            const matchSearch = searchInput === "" || rowName.includes(searchInput) || rowLoc.includes(searchInput) || rowColor.toLowerCase().includes(searchInput) || rowDetail.includes(searchInput);

            return matchType && matchGender && matchColor && matchSearch;
        });
        displayCats(filtered);
    }

    function displayCats(data) {
        const container = document.getElementById('display-area');
        container.innerHTML = '';
        if (data.length === 0) {
            container.innerHTML = '<div class="col-12 text-center py-5 text-muted"><h3>ไม่พบข้อมูลที่ค้นหา</h3></div>';
            return;
        }
        data.forEach((row) => {
            const type = getSafeValue(row, ['ประเภท']);
            const img = fixImageUrl(getSafeValue(row, ['รูปภาพที่ 1', 'รูปภาพ 1']));
            const reward = getSafeValue(row, ['สินน้ำใจ', 'รางวัล']);
            const rewardHtml = (reward && reward !== '0' && reward !== '-') ? `<div class="reward-tag">฿${reward}</div>` : '';

            container.innerHTML += `
                <div class="col">
                    <div class="cat-card" onclick="showDetail(${allCatData.indexOf(row)})">
                        ${rewardHtml}
                        <span class="status-badge ${type === 'แมวหาย' ? 'bg-danger' : 'bg-primary'}">${type}</span>
                        <div class="card-img-container"><img src="${img || 'https://via.placeholder.com/400'}" class="card-img-top"></div>
                        <div class="p-3">
                            <h6 class="fw-bold mb-1 text-truncate">${getSafeValue(row, ['ชื่อแมว'])}</h6>
                            <p class="small text-muted mb-0 text-truncate">📍 ${getSafeValue(row, ['สถานที่', 'พิกัด'])}</p>
                        </div>
                    </div>
                </div>`;
        });
    }

    function showDetail(index) {
        const row = allCatData[index];
        const modalArea = document.getElementById('modal-content-area');
        const images = [
            fixImageUrl(getSafeValue(row, ['รูปภาพที่ 1', 'รูปภาพ 1'])),
            fixImageUrl(getSafeValue(row, ['รูปภาพที่ 2', 'รูปภาพ 2'])),
            fixImageUrl(getSafeValue(row, ['รูปภาพที่ 3', 'รูปภาพ 3']))
        ].filter(url => url !== '');

        let carouselItems = images.map((img, i) => `<div class="carousel-item ${i === 0 ? 'active' : ''}"><img src="${img}" class="d-block w-100"></div>`).join('');
        const reward = getSafeValue(row, ['สินน้ำใจ', 'รางวัล']);
        const fbLink = getSafeValue(row, ['Facebook', 'ลิงก์', 'เฟส']);

        modalArea.innerHTML = `
            <div class="row g-0">
                <div class="col-lg-7 bg-black d-flex align-items-center">
                    <div id="catCarousel" class="carousel slide w-100" data-bs-ride="carousel">
                        <div class="carousel-inner">${carouselItems}</div>
                        ${images.length > 1 ? `<button class="carousel-control-prev" type="button" data-bs-target="#catCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" type="button" data-bs-target="#catCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>` : ''}
                    </div>
                </div>
                <div class="col-lg-5">
                    <div class="detail-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div><h2 class="fw-bold mb-0">${getSafeValue(row, ['ชื่อแมว'])}</h2><span class="badge ${getSafeValue(row, ['ประเภท']) === 'แมวหาย' ? 'bg-danger' : 'bg-primary'} rounded-pill mt-2">${getSafeValue(row, ['ประเภท'])}</span></div>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        ${reward && reward !== '0' && reward !== '-' ? `<div class="reward-highlight">💰 สินน้ำใจตอบแทน: ฿${reward} บาท</div>` : ''}
                        <div class="mb-4 small">
                            <p class="mb-2"><strong>👫 เพศ:</strong> ${getSafeValue(row, ['เพศ'])} | <strong>🎨 สี:</strong> ${getSafeValue(row, ['สี'])}</p>
                            <p class="mb-2"><strong>📍 พิกัด:</strong> ${getSafeValue(row, ['สถานที่', 'พิกัด'])}</p>
                            <p class="mb-2"><strong>📅 วันที่เกิดเหตุ:</strong> ${getSafeValue(row, ['Timestamp', 'วันที่'])}</p>
                        </div>
                        <div class="p-3 bg-light rounded-4 mb-4"><h6 class="fw-bold small">รายละเอียด:</h6><p class="mb-0 text-muted small">${getSafeValue(row, ['รายละเอียด']) || '-'}</p></div>
                        <div class="d-grid gap-2">
                            <a href="tel:${getSafeValue(row, ['เบอร์ติดต่อ', 'โทร'])}" class="btn btn-call">📞 โทรติดต่อเจ้าของ</a>
                            ${fbLink ? `<a href="${fbLink}" target="_blank" class="btn btn-fb">🔵 ดูโพสต์ Facebook</a>` : ''}
                        </div>
                    </div>
                </div>
            </div>`;
        const myModal = new bootstrap.Modal(document.getElementById('catDetailModal'));
        myModal.show();
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
