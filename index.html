<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์แจ้งแมวหาย-แมวหลง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .cat-card { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; height: 100%; }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 250px; object-fit: cover; background-color: #eee; }
        .navbar { background-color: #ff6b6b !important; }
        .btn-success { background-color: #28a745; border: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🐱 ศูนย์แจ้งแมวหาย-แมวหลง</span>
    </div>
</nav>

<div class="container">
    <div id="display-area" class="row row-cols-1 row-cols-md-3 g-4">
        <div class="text-center w-100 py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2">กำลังโหลดข้อมูลแมว...</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    // ✅ แก้ไขแล้ว: ใส่เครื่องหมายคำพูดครอบลิงก์เรียบร้อย
    const public_spreadsheet_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQBat1WTJunSt9WRbR_w0q4uNMC_txGtfw6SRv2XlkdXtHxcNZafPzc9LNSN8Rn5xPXI717FFddww89/pub?gid=1934718548&single=true&output=csv';

    function init() {
        Papa.parse(public_spreadsheet_url, {
            download: true,
            header: true,
            complete: showInfo,
            error: function(err) {
                console.error("Error loading CSV:", err);
                document.getElementById('display-area').innerHTML = '<div class="text-center w-100">เกิดข้อผิดพลาดในการโหลดลิงก์ CSV</div>';
            }
        })
    }

    function showInfo(results) {
        const data = results.data;
        const container = document.getElementById('display-area');
        container.innerHTML = ''; 
        
        // กรองแถวที่ไม่มีข้อมูลจริงออก
        const validData = data.filter(row => row['ชื่อแมว'] && row['ชื่อแมว'].trim() !== "");

        if (validData.length === 0) {
            container.innerHTML = '<div class="text-center w-100 py-5"><h3>📢 ยังไม่มีข้อมูลที่ได้รับอนุมัติในขณะนี้</h3><p>เมื่อแอดมินกด "อนุมัติ" ในระบบ ข้อมูลจะปรากฏที่นี่</p></div>';
            return;
        }

        validData.forEach(row => {
            // ดึงข้อมูลจากคอลัมน์ใน Google Sheets
            const imgUrl = row['web_img_url'] || ''; 
            const catName = row['ชื่อแมว'] || 'ไม่ระบุชื่อ';
            const breed = row['สายพันธุ์'] || 'ไม่ระบุ';
            const feature = row['ลักษณะเด่น'] || '-';
            const location = row['สถานที่พบ/หาย'] || 'ไม่ระบุสถานที่';
            const phone = row['เบอร์ติดต่อ *'] || '';

            const card = `
                <div class="col">
                    <div class="card shadow-sm cat-card">
                        <img src="${imgUrl}" class="card-img-top" alt="รูปแมว" onerror="this.src='https://via.placeholder.com/400x300?text=กำลังรอรูปภาพจากระบบ...'">
                        <div class="card-body">
                            <h5 class="card-title text-danger"><b>${catName}</b></h5>
                            <hr>
                            <p class="card-text">
                                <b>📌 สายพันธุ์:</b> ${breed}<br>
                                <b>🎨 ลักษณะ:</b> ${feature}<br>
                                <b>📍 พิกัด:</b> ${location}
                            </p>
                            <div class="d-grid gap-2">
                                <a href="tel:${phone}" class="btn btn-success">📞 โทรติดต่อเจ้าของ</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    window.addEventListener('DOMContentLoaded', init)
</script>

</body>
</html>
