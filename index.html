<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์แจ้งแมวหาย-แมวหลง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
        .cat-card { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; height: 100%; position: relative; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 250px; object-fit: cover; background-color: #eee; }
        .navbar { background-color: #ff6b6b !important; }
        .filter-btn { border-radius: 20px; padding: 8px 20px; font-weight: bold; min-width: 100px; border: 2px solid #ff6b6b; color: #ff6b6b; }
        .filter-btn.active { background-color: #ff6b6b !important; color: white !important; }
        .badge-type { position: absolute; top: 10px; right: 10px; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; z-index: 10; color: white; font-weight: bold; }
        .text-truncate-multi { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; color: #6c757d; font-size: 0.9rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container text-center"><span class="navbar-brand mb-0 h1">🐱 ศูนย์แจ้งแมวหาย-แมวหลง</span></div>
</nav>

<div class="container mb-4 text-center">
    <div class="btn-group gap-2">
        <button class="btn btn-outline-danger filter-btn active" onclick="filterCats('ทั้งหมด', this)">ทั้งหมด</button>
        <button class="btn btn-outline-danger filter-btn" onclick="filterCats('แมวหาย', this)">🚨 แมวหาย</button>
        <button class="btn btn-outline-primary filter-btn" onclick="filterCats('แมวหลง', this)">🏠 แมวหลง</button>
    </div>
</div>

<div class="container">
    <div id="display-area" class="row row-cols-1 row-cols-md-3 g-4">
        <div class="text-center w-100 py-5"><div class="spinner-border text-danger"></div><p>กำลังโหลดข้อมูล...</p></div>
    </div>
</div>

<!-- Modal รายละเอียด (ตัดรูปภาพออกแล้ว) -->
<div class="modal fade" id="catDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-md">
        <div class="modal-content" style="border-radius: 20px; border:none; overflow:hidden;">
            <div id="modal-content-area" class="p-4"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    let allCatData = []; 
    const public_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQBat1WTJunSt9WRbR_w0q4uNMC_txGtfw6SRv2XlkdXtHxcNZafPzc9LNSN8Rn5xPXI717FFddww89/pub?gid=1934718548&single=true&output=csv';

    function init() {
        Papa.parse(public_url, {
            download: true,
            header: true, // ✅ ตรวจจับหัวข้อแถวที่ 1 อัตโนมัติ
            skipEmptyLines: true,
            complete: function(results) {
                allCatData = results.data.filter(row => row['ชื่อแมว'] && row['ชื่อแมว'].trim() !== "");
                displayCats(allCatData);
            }
        });
    }

    function displayCats(data) {
        const container = document.getElementById('display-area');
        container.innerHTML = ''; 

        data.forEach((row, index) => {
            const type = row['ประเภท'] || 'ไม่ระบุ';
            const badgeClass = type === 'แมวหาย' ? 'bg-danger' : 'bg-primary';
            // ✅ ดึงรูปภาพจากหัวข้อ "ลิงก์รูปภาพที่ 1" มาแสดงที่หน้าการ์ดหลัก
            const mainImg = row['ลิงก์รูปภาพที่ 1'] || 'https://via.placeholder.com/400x300?text=ไม่มีรูปภาพ';
            
            container.innerHTML += `
                <div class="col">
                    <div class="card cat-card shadow-sm" onclick="showFullDetail(${index})">
                        <span class="badge badge-type ${badgeClass}">${type}</span>
                        <img src="${mainImg}" class="card-img-top" onerror="this.src='https://via.placeholder.com/400x300?text=รูปภาพไม่ถูกต้อง'">
                        <div class="card-body">
                            <h5 class="card-title text-danger"><b>${row['ชื่อแมว']}</b></h5>
                            <hr>
                            <p class="mb-1" style="font-size: 0.9rem;"><b>📍 พิกัด:</b> ${row['สถานที่พบ/หาย'] || '-'}</p>
                            <p class="mb-1" style="font-size: 0.9rem;"><b>📅 วันที่:</b> ${row['วันที่หาย/พบ'] || '-'}</p>
                            <div class="mt-2 p-2 bg-light rounded">
                                <div class="text-truncate-multi"><b>📝 ลักษณะ:</b> ${row['ลักษณะเด่น'] || '-'}</div>
                            </div>
                            <div class="d-grid mt-3">
                                <a href="tel:${row['เบอร์ติดต่อ *']}" class="btn btn-success" onclick="event.stopPropagation();">📞 โทรติดต่อ</a>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function showFullDetail(index) {
        const row = allCatData[index];
        const type = row['ประเภท'] || 'ไม่ระบุ';
        const badgeClass = type === 'แมวหาย' ? 'bg-danger' : 'bg-primary';
        const modalArea = document.getElementById('modal-content-area');

        // ✅ แสดงเฉพาะรายละเอียดข้อความ ไม่มีรูปภาพด้านในตามที่ขอ
        modalArea.innerHTML = `
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="badge ${badgeClass} mb-2">${type}</span>
                    <h2 class="text-danger mb-0"><b>${row['ชื่อแมว']}</b></h2>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <hr>
            <p><b>📌 สายพันธุ์:</b> ${row['สายพันธุ์'] || '-'}</p>
            <p><b>📅 วันที่:</b> ${row['วันที่หาย/พบ'] || '-'}</p>
            <p><b>⏰ เวลา:</b> ${row['เวลา'] || '-'}</p>
            <p><b>📍 พิกัด:</b> ${row['สถานที่พบ/หาย'] || '-'}</p>
            <div class="mt-3">
                <p class="fw-bold mb-1">📝 รายละเอียดเพิ่มเติม:</p>
                <div class="p-3 bg-light rounded" style="white-space: pre-wrap; font-size: 1rem; border-left: 5px solid #ff6b6b;">
                    ${row['ลักษณะเด่น'] || 'ไม่มีข้อมูล'}
                </div>
            </div>
            <div class="d-grid mt-4">
                <a href="tel:${row['เบอร์ติดต่อ *']}" class="btn btn-lg btn-success">📞 โทร: ${row['เบอร์ติดต่อ *']}</a>
            </div>`;
        
        new bootstrap.Modal(document.getElementById('catDetailModal')).show();
    }

    function filterCats(type, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        displayCats(type === 'ทั้งหมด' ? allCatData : allCatData.filter(r => r['ประเภท'] === type));
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
