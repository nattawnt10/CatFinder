<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์แจ้งแมวหาย-แมวหลง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .cat-card { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; height: 100%; position: relative; }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 250px; object-fit: cover; background-color: #eee; }
        .navbar { background-color: #ff6b6b !important; }
        .filter-btn { border-radius: 20px; padding: 8px 20px; font-weight: bold; min-width: 100px; }
        .filter-btn.active { background-color: #ff6b6b; color: white; border-color: #ff6b6b; }
        .badge-type { position: absolute; top: 10px; right: 10px; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; z-index: 10; color: white; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container text-center">
        <span class="navbar-brand mb-0 h1">🐱 ศูนย์แจ้งแมวหาย-แมวหลง</span>
    </div>
</nav>

<div class="container mb-4 text-center">
    <div class="btn-group gap-2" role="group">
        <button type="button" class="btn btn-outline-secondary filter-btn active" onclick="filterCats('ทั้งหมด', this)">ทั้งหมด</button>
        <button type="button" class="btn btn-outline-danger filter-btn" onclick="filterCats('แมวหาย', this)">🚨 แมวหาย</button>
        <button type="button" class="btn btn-outline-primary filter-btn" onclick="filterCats('แมวหลง', this)">🏠 แมวหลง</button>
    </div>
</div>

<div class="container">
    <div id="display-area" class="row row-cols-1 row-cols-md-3 g-4">
        <div class="text-center w-100 py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2">กำลังโหลดข้อมูลแมว...</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    let allCatData = []; 
    const public_spreadsheet_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQBat1WTJunSt9WRbR_w0q4uNMC_txGtfw6SRv2XlkdXtHxcNZafPzc9LNSN8Rn5xPXI717FFddww89/pub?gid=1934718548&single=true&output=csv';

    function init() {
        Papa.parse(public_spreadsheet_url, {
            download: true,
            header: true,
            complete: function(results) {
                // กรองแถวที่ไม่มีข้อมูลชื่อแมวออก
                allCatData = results.data.filter(row => row['ชื่อแมว'] && row['ชื่อแมว'].trim() !== "");
                displayCats(allCatData);
            }
        });
    }

    function filterCats(type, btnElement) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        if (type === 'ทั้งหมด') {
            displayCats(allCatData);
        } else {
            const filtered = allCatData.filter(row => row['ประเภท'] === type);
            displayCats(filtered);
        }
    }

    function displayCats(data) {
        const container = document.getElementById('display-area');
        container.innerHTML = ''; 

        if (data.length === 0) {
            container.innerHTML = '<div class="text-center w-100 py-5"><h3>📢 ไม่พบข้อมูลในหมวดนี้</h3></div>';
            return;
        }

        data.forEach(row => {
            const imgUrl = row['web_img_url'] || ''; 
            const type = row['ประเภท'] || 'ไม่ระบุ';
            const badgeClass = type === 'แมวหาย' ? 'bg-danger' : 'bg-primary';
            
            const card = `
                <div class="col">
                    <div class="card shadow-sm cat-card">
                        <span class="badge badge-type ${badgeClass}">${type}</span>
                        <img src="${imgUrl}" class="card-img-top" onerror="this.src='https://via.placeholder.com/400x300?text=รอรูปภาพ...'">
                        <div class="card-body">
                            <h5 class="card-title text-danger"><b>${row['ชื่อแมว']}</b></h5>
                            <hr>
                            <p class="card-text" style="font-size: 0.9rem;">
                                <b>📌 สายพันธุ์:</b> ${row['สายพันธุ์'] || '-'}<br>
                                <b>🎨 ลักษณะ:</b> ${row['ลักษณะเด่น'] || '-'}<br>
                                <b>📍 พิกัด:</b> ${row['สถานที่พบ/หาย'] || '-'}<br>
                                <b>📅 วันที่:</b> ${row['วันที่พบหาย'] || '-'}<br>
                                <b>⏰ เวลา:</b> ${row['เวลา'] || '-'}
                            </p>
                            <div class="d-grid gap-2">
                                <a href="tel:${row['เบอร์ติดต่อ *']}" class="btn btn-success" style="background-color: #28a745; border:none;">📞 โทรติดต่อเจ้าของ</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
