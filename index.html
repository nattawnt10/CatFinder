<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์แจ้งแมวหาย-แมวหลง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
        .cat-card { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; height: 100%; position: relative; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 280px; object-fit: cover; background-color: #eee; }
        .navbar { background-color: #ff6b6b !important; }
        .badge-type { position: absolute; top: 10px; right: 10px; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; z-index: 10; color: white; font-weight: bold; }
        .text-truncate-multi { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; color: #6c757d; font-size: 0.9rem; }
        /* สไตล์สไลด์รูปในรายละเอียด */
        .modal-carousel-img { height: 400px; object-fit: contain; background-color: #333; width: 100%; }
        .carousel-indicators [button] { background-color: #ff6b6b; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container text-center"><span class="navbar-brand mb-0 h1">🐱 ศูนย์แจ้งแมวหาย-แมวหลง</span></div>
</nav>

<div class="container mb-4 text-center">
    <div class="btn-group gap-2">
        <button class="btn btn-outline-danger active" onclick="filterCats('ทั้งหมด', this)" style="border-radius:20px;">ทั้งหมด</button>
        <button class="btn btn-outline-danger" onclick="filterCats('แมวหาย', this)" style="border-radius:20px;">🚨 แมวหาย</button>
        <button class="btn btn-outline-primary" onclick="filterCats('แมวหลง', this)" style="border-radius:20px;">🏠 แมวหลง</button>
    </div>
</div>

<div class="container">
    <div id="display-area" class="row row-cols-1 row-cols-md-3 g-4"></div>
</div>

<!-- Modal รายละเอียด (มีสไลด์รูป 4 ภาพ) -->
<div class="modal fade" id="catDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="border-radius: 20px; border:none; overflow:hidden;">
            <div id="modal-content-area"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    let allCatData = []; 
    const public_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQBat1WTJunSt9WRbR_w0q4uNMC_txGtfw6SRv2XlkdXtHxcNZafPzc9LNSN8Rn5xPXI717FFddww89/pub?gid=1934718548&single=true&output=csv';

    function init() {
        Papa.parse(public_url, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allCatData = results.data.filter(row => row['ชื่อแมว']);
                displayCats(allCatData);
            }
        });
    }

    function displayCats(data) {
        const container = document.getElementById('display-area');
        container.innerHTML = ''; 

        data.forEach((row, index) => {
            const type = row['ประเภท'] || 'ไม่ระบุ';
            const badgeClass = type === 'แมวหาย' ? 'bg-danger' : 'bg-primary';
            // ✅ แก้ไขหัวข้อรูปหลักให้ตรงกับ Excel: "ลิงค์รูปภาพที่ 1"
            const mainImg = row['ลิงค์รูปภาพที่ 1'] || 'https://via.placeholder.com/400x300?text=ไม่มีรูปภาพ';
            
            container.innerHTML += `
                <div class="col">
                    <div class="card cat-card shadow-sm" onclick="showFullDetail(${index})">
                        <span class="badge badge-type ${badgeClass}">${type}</span>
                        <img src="${mainImg}" class="card-img-top" onerror="this.src='https://via.placeholder.com/400x300?text=รูปภาพไม่ถูกต้อง'">
                        <div class="card-body">
                            <h5 class="card-title text-danger"><b>${row['ชื่อแมว']}</b></h5>
                            <hr>
                            <p class="mb-1" style="font-size: 0.9rem;"><b>📍 พิกัด:</b> ${row['สถานที่พบ/หาย'] || '-'}</p>
                            <p class="mb-1" style="font-size: 0.9rem;"><b>📅 วันที่:</b> ${row['วันที่หาย/วันที่พบ'] || '-'}</p>
                            <div class="mt-2 p-2 bg-light rounded">
                                <div class="text-truncate-multi"><b>📝 ลักษณะ:</b> ${row['รายละเอียด'] || '-'}</div>
                            </div>
                            <div class="d-grid mt-3">
                                <button class="btn btn-success" style="border-radius:10px;">📞 ดูรายละเอียดติดต่อ</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function showFullDetail(index) {
        const row = allCatData[index];
        const modalArea = document.getElementById('modal-content-area');

        // ✅ รวบรวมรูปภาพ 1-4
        let imgs = [];
        if(row['ลิงค์รูปภาพที่ 1']) imgs.push(row['ลิงค์รูปภาพที่ 1']);
        if(row['ลิงค์รูปภาพที่ 2']) imgs.push(row['ลิงค์รูปภาพที่ 2']);
        if(row['ลิงค์รูปภาพที่ 3']) imgs.push(row['ลิงค์รูปภาพที่ 3']);
        if(row['ลิงค์รูปภาพที่ 4']) imgs.push(row['ลิงค์รูปภาพที่ 4']);

        let carouselHtml = `
            <div id="catCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    ${imgs.map((img, i) => `
                        <div class="carousel-item ${i === 0 ? 'active' : ''}">
                            <img src="${img}" class="d-block modal-carousel-img">
                        </div>
                    `).join('')}
                </div>
                ${imgs.length > 1 ? `
                    <button class="carousel-control-prev" type="button" data-bs-target="#catCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                    <button class="carousel-control-next" type="button" data-bs-target="#catCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
                ` : ''}
            </div>`;

        modalArea.innerHTML = `
            <div class="row g-0">
                <div class="col-lg-6">${carouselHtml}</div>
                <div class="col-lg-6 p-4">
                    <div class="d-flex justify-content-between">
                        <h2 class="text-danger"><b>${row['ชื่อแมว']}</b></h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <p class="mb-1 text-muted">เพศ: ${row['เพศ'] || '-'} | สี: ${row['สี'] || '-'}</p>
                    <hr>
                    <div style="font-size: 0.95rem;">
                        <p class="mb-1"><b>📌 สายพันธุ์:</b> ${row['สายพันธุ์'] || '-'}</p>
                        <p class="mb-1"><b>📍 พิกัด:</b> ${row['สถานที่พบ/หาย'] || '-'}</p>
                        <p class="mb-1"><b>📅 วันที่:</b> ${row['วันที่หาย/วันที่พบ'] || '-'}</p>
                    </div>
                    <div class="mt-3 p-3 bg-light rounded">
                        <p class="fw-bold mb-1">📝 รายละเอียด:</p>
                        <p class="mb-0 small">${row['รายละเอียด'] || '-'}</p>
                    </div>
                    <div class="mt-4">
                        <a href="tel:${row['เบอร์ติดต่อ *']}" class="btn btn-success w-100 mb-2">📞 โทร: ${row['เบอร์ติดต่อ *']}</a>
                        ${row['ช่องทางติดต่อ Facebook'] ? `<a href="${row['ช่องทางติดต่อ Facebook']}" target="_blank" class="btn btn-primary w-100">🔵 ติดต่อทาง Facebook</a>` : ''}
                    </div>
                </div>
            </div>`;
        
        new bootstrap.Modal(document.getElementById('catDetailModal')).show();
    }

    function filterCats(type, btn) {
        document.querySelectorAll('.btn-outline-danger, .btn-outline-primary').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        displayCats(type === 'ทั้งหมด' ? allCatData : allCatData.filter(r => r['ประเภท'] === type));
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
