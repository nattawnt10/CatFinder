<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์แจ้งแมวหาย-แมวหลง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { background-color: #f8f9fa; font-family: 'Sarabun', sans-serif; }
        .cat-card { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; height: 100%; position: relative; cursor: pointer; }
        .cat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-img-top { height: 250px; object-fit: cover; background-color: #eee; }
        .navbar { background-color: #ff6b6b !important; }
        .filter-btn { border-radius: 20px; padding: 8px 20px; font-weight: bold; min-width: 100px; border: 2px solid #ff6b6b; color: #ff6b6b; }
        .filter-btn.active { background-color: #ff6b6b !important; color: white !important; }
        .badge-type { position: absolute; top: 10px; right: 10px; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; z-index: 10; color: white; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        /* ย่อข้อความรายละเอียด */
        .text-truncate-multi { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; color: #6c757d; font-size: 0.9rem; }
        .modal-carousel-img { height: 450px; object-fit: contain; background-color: #000; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container text-center">
        <span class="navbar-brand mb-0 h1">🐱 ศูนย์แจ้งแมวหาย-แมวหลง</span>
    </div>
</nav>

<div class="container mb-4 text-center">
    <div class="btn-group gap-2" role="group">
        <button type="button" class="btn btn-outline-danger filter-btn active" onclick="filterCats('ทั้งหมด', this)">ทั้งหมด</button>
        <button type="button" class="btn btn-outline-danger filter-btn" onclick="filterCats('แมวหาย', this)">🚨 แมวหาย</button>
        <button type="button" class="btn btn-outline-primary filter-btn" onclick="filterCats('แมวหลง', this)">🏠 แมวหลง</button>
    </div>
</div>

<div class="container">
    <div id="display-area" class="row row-cols-1 row-cols-md-3 g-4">
        <div class="text-center w-100 py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2">กำลังโหลดข้อมูลระบบ...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="catDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" style="border-radius: 20px; border:none; overflow:hidden;">
            <div id="modal-content-area"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    let allCatData = []; 
    // URL CSV จาก Google Sheets
    const public_spreadsheet_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQBat1WTJunSt9WRbR_w0q4uNMC_txGtfw6SRv2XlkdXtHxcNZafPzc9LNSN8Rn5xPXI717FFddww89/pub?gid=1934718548&single=true&output=csv';

    function init() {
        Papa.parse(public_spreadsheet_url, {
            download: true,
            header: true, // ตรวจจับจากหัวข้อแถวที่ 1
            skipEmptyLines: true,
            complete: function(results) {
                // กรองเฉพาะแถวที่อนุมัติและมีชื่อแมว
                allCatData = results.data.filter(row => row['ชื่อแมว'] && row['ชื่อแมว'].trim() !== "");
                displayCats(allCatData);
            }
        });
    }

    function displayCats(data) {
        const container = document.getElementById('display-area');
        container.innerHTML = ''; 

        data.forEach((row, index) => {
            const type = row['ประเภท'] || 'ไม่ระบุ';
            const badgeClass = type === 'แมวหาย' ? 'bg-danger' : 'bg-primary';
            const mainImg = row['web_img_url'] || 'https://via.placeholder.com/400x300?text=รอรูปภาพ...';
            
            const card = `
                <div class="col">
                    <div class="card shadow-sm cat-card" onclick="showFullDetail(${index})">
                        <span class="badge badge-type ${badgeClass}">${type}</span>
                        <img src="${mainImg}" class="card-img-top" onerror="this.src='https://via.placeholder.com/400x300?text=รูปภาพไม่ถูกต้อง'">
                        <div class="card-body">
                            <h5 class="card-title text-danger"><b>${row['ชื่อแมว']}</b></h5>
                            <hr>
                            <p class="mb-1" style="font-size: 0.9rem;"><b>📍 พิกัด:</b> ${row['สถานที่พบ/หาย'] || '-'}</p>
                            <p class="mb-1" style="font-size: 0.9rem;"><b>📅 วันที่:</b> ${row['วันที่พบหาย'] || '-'}</p>
                            
                            <div class="mt-2 p-2 bg-light rounded">
                                <small class="text-secondary"><b>📝 รายละเอียดการหาย:</b></small>
                                <div class="text-truncate-multi">${row['ลักษณะเด่น'] || '-'}</div>
                                <small class="text-primary" style="font-size: 0.75rem;">คลิกเพื่ออ่านเพิ่ม/ดูรูป 4 รูป...</small>
                            </div>

                            <div class="d-grid gap-2 mt-3">
                                <a href="tel:${row['เบอร์ติดต่อ *']}" class="btn btn-success" onclick="event.stopPropagation();">📞 โทรติดต่อเจ้าของ</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });
    }

    function showFullDetail(index) {
        const row = allCatData[index];
        const type = row['ประเภท'] || 'ไม่ระบุ';
        const badgeClass = type === 'แมวหาย' ? 'bg-danger' : 'bg-primary';
        const modalArea = document.getElementById('modal-content-area');

        // ตรวจจับรูปภาพ 1-4 จากชื่อหัวข้อแถวที่ 1
        let images = [];
        ['web_img_url', 'web_img_url_2', 'web_img_url_3', 'web_img_url_4'].forEach(key => {
            if (row[key] && row[key].trim().startsWith('http')) {
                images.push(row[key].trim());
            }
        });

        // สร้างสไลด์ Carousel
        let carouselHtml = `
            <div id="catCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    ${images.length > 0 ? images.map((img, i) => `
                        <div class="carousel-item ${i === 0 ? 'active' : ''}">
                            <img src="${img}" class="d-block w-100 modal-carousel-img">
                        </div>
                    `).join('') : `<div class="carousel-item active"><img src="https://via.placeholder.com/400x300?text=ไม่มีรูปภาพ" class="d-block w-100 modal-carousel-img"></div>`}
                </div>
                ${images.length > 1 ? `
                    <button class="carousel-control-prev" type="button" data-bs-target="#catCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                    <button class="carousel-control-next" type="button" data-bs-target="#catCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
                ` : ''}
            </div>`;

        modalArea.innerHTML = `
            <div class="row g-0">
                <div class="col-md-6 bg-dark d-flex align-items-center">${carouselHtml}</div>
                <div class="col-md-6 p-4">
                    <div class="d-flex justify-content-between">
                        <span class="badge ${badgeClass} mb-2" style="font-size: 0.9rem;">${type}</span>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <h2 class="text-danger"><b>${row['ชื่อแมว']}</b></h2>
                    <div class="info-list" style="font-size: 0.95rem;">
                        <p class="mb-1"><b>📌 สายพันธุ์:</b> ${row['สายพันธุ์'] || '-'}</p>
                        <p class="mb-1"><b>📅 วันที่:</b> ${row['วันที่พบหาย'] || '-'}</p>
                        <p class="mb-1"><b>⏰ เวลา:</b> ${row['เวลา'] || '-'}</p>
                        <p class="mb-1"><b>📍 พิกัด:</b> ${row['สถานที่พบ/หาย'] || '-'}</p>
                    </div>
                    <hr>
                    <p class="fw-bold mb-1">📝 รายละเอียดการหายแบบเต็ม:</p>
                    <div class="p-3 bg-light rounded" style="white-space: pre-wrap; max-height: 250px; overflow-y: auto; font-size: 0.9rem;">${row['ลักษณะเด่น'] || '-'}</div>
                    <div class="d-grid gap-2 mt-4">
                        <a href="tel:${row['เบอร์ติดต่อ *']}" class="btn btn-lg btn-success shadow-sm">📞 โทรติดต่อ: ${row['เบอร์ติดต่อ *']}</a>
                    </div>
                </div>
            </div>`;
        
        const myModal = new bootstrap.Modal(document.getElementById('catDetailModal'));
        myModal.show();
    }

    function filterCats(type, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filtered = type === 'ทั้งหมด' ? allCatData : allCatData.filter(r => r['ประเภท'] === type);
        displayCats(filtered);
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
